<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111016">
  <title>Floor Is Lava</title>
  <link rel="stylesheet" href="./styles.css">
  <style>
    #updateBanner{position:fixed;top:0;left:0;right:0;z-index:50;display:flex;align-items:center;gap:10px;padding:10px 14px;background:#ffb300;color:#111016;font-weight:800;font-size:14px;box-shadow:0 2px 10px rgba(0,0,0,.45)}
    #updateBanner[hidden]{display:none}
    #updateBanner #updateBtn{border:none;border-radius:8px;padding:6px 14px;background:#111016;color:#fff;cursor:pointer}
    #updateBanner #updateClose{margin-left:auto;background:transparent;color:#111016;font-size:20px;line-height:1;padding:2px 8px}
    #checkUpdateButton{margin-top:12px;min-height:30px;padding:0 16px;font-size:12px;font-weight:700;color:#9a93a8;background:transparent;border:1px solid rgba(255,255,255,.18)}
    .hud{grid-template-columns:64px 1fr 64px}
    .hud .timer-wrap{grid-column:1/-1;margin-top:6px}
    .name-row{display:flex;align-items:center;gap:8px;justify-content:center;margin:8px 0 4px}
    .name-row span{font-size:13px;color:#cfc9dd}
    #playerName{width:200px;max-width:62vw;padding:9px 11px;border-radius:9px;border:1px solid #3a3a4a;background:#1c1b24;color:#f7f4e9;font:inherit;font-size:15px;user-select:text;-webkit-user-select:text;-moz-user-select:text;touch-action:auto}
    #playerName:focus{outline:none;border-color:#73d16a}
    #playerNameLabel{font-size:15px;color:#ffd166}
    .leaderboard{margin-top:14px;text-align:left;font-size:13px;color:#cfc9dd}
    .leaderboard h2{margin:0 0 6px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#9a93a8}
    .leaderboard ol{margin:0;padding:0;list-style:none}
    .leaderboard li{display:flex;gap:10px;padding:4px 2px;border-top:1px solid rgba(255,255,255,.08)}
    .leaderboard li.me{color:#ffd166;font-weight:800}
    .leaderboard .rank{width:20px;color:#9a93a8;text-align:right;font-variant-numeric:tabular-nums}
    .leaderboard .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .leaderboard .sc{font-variant-numeric:tabular-nums;font-weight:700}
    .leaderboard .empty{color:#7d7689;font-style:italic}
    .panel{max-height:calc(100dvh - 48px);overflow:auto}
  </style>
</head>
<body>
  <main class="app" aria-label="Floor Is Lava game">
    <section class="game-shell">
      <div class="hud" aria-live="polite">
        <div><span class="label">Score</span><strong id="score">0</strong></div>
        <div><span class="label">Player</span><strong id="playerNameLabel">—</strong></div>
        <div><span class="label">Best</span><strong id="bestScore">0</strong></div>
        <div class="timer-wrap" aria-label="Decision timer"><span id="timerFill"></span></div>
      </div>
      <canvas id="gameCanvas" width="420" height="760" aria-label="Game board"></canvas>
      <div class="controls">
        <button id="soundToggle" type="button" aria-pressed="true">Sound On</button>
        <button id="vibrationToggle" type="button" aria-pressed="true">Vibration On</button>
      </div>
      <div id="overlay" class="overlay">
        <div class="panel">
          <h1>Floor Is Lava</h1>
          <p id="overlayText">Tap the green tile in the next row. Avoid lava. Move fast.</p>
          <label class="name-row"><span>Name</span><input id="playerName" type="text" maxlength="16" placeholder="Your name" autocomplete="off" spellcheck="false"></label>
          <button id="playButton" type="button">Play</button>
          <div id="leaderboard" class="leaderboard"></div>
          <button id="checkUpdateButton" type="button">Check for updates</button>
        </div>
      </div>
    </section>
  <div id="updateBanner" hidden>
    <span id="updateText"></span>
    <button id="updateBtn" type="button">Update</button>
    <button id="updateClose" type="button" aria-label="Close">×</button>
  </div>
  </main>
  <script src="./game.js"></script>
</body>
</html>
